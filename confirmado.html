<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Correo confirmado — GateFlow RX</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      color: #1f2937;
      background: #f8fafc;
    }
    .card {
      max-width: 460px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(2, 132, 199, 0.12);
    }
    .check {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #0ea5e9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 40px; height: 40px; stroke: #ffffff; stroke-width: 3.5; fill: none; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; color: #0369a1; }
    p { font-size: 1.05rem; margin: 0.5rem 0; color: #334155; }
    .brand { margin-top: 28px; font-size: 0.9rem; color: #94a3b8; letter-spacing: 0.3px; }
    .brand b { color: #0ea5e9; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; border-color: #334155; box-shadow: 0 10px 40px rgba(0,0,0,0.45); }
      h1 { color: #7dd3fc; }
      p { color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 6"></polyline></svg>
    </div>
    <h1>¡Gracias por confirmar tu correo!</h1>
    <p>Tu cuenta ha quedado verificada correctamente.</p>
    <p>Ya puedes cerrar esta página. Favor de regresar a la aplicación.</p>
    <div class="brand">GateFlow <b>RX</b></div>
  </div>
</body>
</html>
